name: CI/CD - Build, Push to ACR & Deploy to AKS (quip-coA via k8s folder)

on:
  push:
    branches:
      - develop

env:
  ACR_NAME: nextrowdevcr
  IMAGE_PATH: nextrowdevcr.azurecr.io/dev/quip-coa-ms
  NAMESPACE: quip-coa-dev

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      IMAGE: ${{ steps.build.outputs.IMAGE }}

    steps:
    # -------------------------------
    # Checkout
    # -------------------------------
    - name: Checkout
      uses: actions/checkout@v3

    # -------------------------------
    # Setup Java + Build
    # -------------------------------
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix mvnw permission
      run: chmod +x mvnw

    - name: Maven Package
      run: ./mvnw clean package -DskipTests

    # -------------------------------
    # Docker Build + Push to ACR
    # -------------------------------
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: ACR Login
      run: az acr login --name $ACR_NAME

    - name: Build & Push Image
      id: build
      run: |
        TAG=v${{ github.run_number }}
        VERSIONED=$IMAGE_PATH:$TAG
        LATEST=$IMAGE_PATH:latest

        echo "IMAGE=$VERSIONED" >> $GITHUB_OUTPUT

        docker build -t $VERSIONED -t $LATEST .
        docker push $VERSIONED
        docker push $LATEST

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # -------------------------------
    # Login & Connect to AKS
    # -------------------------------
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        cluster-name: ${{ secrets.AKS_CLUSTER_NAME_DEV }}
        resource-group: ${{ secrets.AKS_RESOURCE_GROUP_DEV }}

    - name: Install kubelogin
      run: az aks install-cli

    - name: Authenticate kubectl
      run: |
        kubelogin convert-kubeconfig -l spn \
          --client-id ${{ secrets.AZURE_CLIENT_ID }} \
          --client-secret ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant-id ${{ secrets.AZURE_TENANT_ID }}

    # -------------------------------
    # Update Deployment YAML with Image
    # -------------------------------
    - name: Patch Image Tag
      run: |
        sed -i "s|image: .*|image: ${{ needs.build.outputs.IMAGE }}|g" k8s/deployment.yaml

    # -------------------------------
    # Apply All Manifests in k8s/
    # -------------------------------
    - name: Deploy with k8s manifests
      run: |
        kubectl apply -f k8s/
        kubectl rollout status deployment/quip-coa-ms -n $NAMESPACE

    # -------------------------------
    # Service External IP
    # -------------------------------
    - name: Get External IP
      run: |
        echo "Waiting for external IP..."
        for i in {1..40}; do
          IP=$(kubectl get svc quip-coa-ms -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$IP" ]; then
            echo "APP_URL=http://$IP" >> $GITHUB_ENV
            echo "Application URL → http://$IP"
            exit 0
          fi
          sleep 10
        done
        echo "Failed to get external IP"
        exit 1
